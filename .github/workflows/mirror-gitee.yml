name: Mirror to Gitee

# 将 GitHub 仓库自动镜像到 Gitee（国内访问加速）。
# 触发：push 到 main、打 v* 标签、或手动 workflow_dispatch。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    # 防止递归：本仓库的 push 由 GitHub 原生触发，不会因 Gitee 回推产生循环。
    steps:
      - name: Mirror GitHub → Gitee
        env:
          GITEE_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          set -e
          # 1. 写入专用 Gitee 部署密钥（仅 Gitee 可见，与本地日常用钥分离）
          mkdir -p ~/.ssh
          printf '%s\n' "$GITEE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null || true

          # 2. 以公开 HTTPS 完整镜像 clone GitHub（无需鉴权）
          rm -rf /tmp/mtphp-mirror
          git clone --mirror https://github.com/KianHugh/mtphp.git /tmp/mtphp-mirror
          cd /tmp/mtphp-mirror

          # 3. 推送镜像到 Gitee（--mirror 同步所有分支/标签，并删除 Gitee 多余引用）
          git remote set-url --push origin git@gitee.com:kianhugh/mtphp.git
          git push --mirror
